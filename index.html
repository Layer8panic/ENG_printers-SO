<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Oral Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e9; --card:#fffdf9; --ink:#1d2433; --muted:#6b6f7a; --line:#e6ddcf;
  --blue:#2f4fd8; --blue-soft:#e6ebff; --coral:#e8603c; --coral-soft:#fde8e1;
  --green:#1f8a5b; --green-soft:#ddf3e8; --amber:#b7791f; --amber-soft:#fbefd6;
  --radius:18px; --shadow:0 1px 2px rgba(29,36,51,.06),0 6px 18px rgba(29,36,51,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171f;--card:#1d212c;--ink:#eef0f5;--muted:#9aa0ad;--line:#2c3140;
  --blue:#8aa2ff;--blue-soft:#232b4a;--coral:#ff8a66;--coral-soft:#3a2520;
  --green:#5fd39c;--green-soft:#173327;--amber:#f0b75a;--amber-soft:#3a2e17;
  --shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line)}
header h1{font-size:21px;flex:1}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;font-size:20px}
.back.show{display:flex}
.speed{font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
main{padding:6px 16px calc(96px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted)}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--blue);background:var(--blue-soft)}
.topic{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.topic .num{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--blue-soft)}
.topic h3{font-size:17px;line-height:1.25}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .4s}
.qrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:9px;background:var(--line)}
.dot.s3{background:var(--green)}.dot.s2{background:var(--amber)}.dot.s1{background:var(--coral)}
.qbig{font-family:'Fraunces',Georgia,serif;font-size:22px;line-height:1.25;font-weight:600}
.qit{margin-top:6px;color:var(--muted);font-size:15px}
.play{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
@media (prefers-color-scheme:dark){.play{color:#14171f}}
.play.sm{width:32px;height:32px;font-size:13px}
.play.ghost{background:var(--blue-soft);color:var(--blue)}
.row{display:flex;gap:12px;align-items:flex-start}
.row .grow{flex:1;min-width:0}
.starter{background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-weight:500}
.starter b{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px;text-align:left}
.chip span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.chip.got{background:var(--green-soft);color:var(--green)}
.sent{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.sent:last-child{border-bottom:0}
.sent .t{flex:1;font-size:17px}
.sent .step{flex:none;font-size:12px;font-weight:700;color:var(--coral);background:var(--coral-soft);border-radius:8px;padding:3px 7px;margin-top:3px}
.hidden-text .t{filter:blur(6px);user-select:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--blue)}.sw.on::after{left:23px}
.word{display:flex;align-items:center;gap:10px;padding:8px 0}
.word b{font-size:16px}
.word .pr{font-size:14px;color:var(--coral);font-weight:700}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'＋';color:var(--muted)}
details[open] summary::after{content:'－'}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:16px;background:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#14171f}}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn+.btn{margin-top:10px}
.pager{display:flex;gap:10px;margin-top:6px}
.pager .btn{margin:0}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rate button{padding:12px 4px;border-radius:14px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rate .e{font-size:26px}
.r1{background:var(--coral-soft);color:var(--coral)}.r2{background:var(--amber-soft);color:var(--amber)}.r3{background:var(--green-soft);color:var(--green)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.pick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{padding:6px 2px 2px}
.hero h2{font-size:26px;line-height:1.15}
.steps3{counter-reset:s;margin:0;padding:0;list-style:none}
.steps3 li{counter-increment:s;display:flex;gap:12px;padding:8px 0}
.steps3 li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.ph{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border-bottom:0}
.ph .grow b{display:block;font-weight:500}
.ph .grow span{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
.reveal{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.center{text-align:center}
.big-emoji{font-size:48px}
.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<header id="hdr">
  <button class="back" id="back" aria-label="Indietro">←</button>
  <h1 id="title">English Oral Coach</h1>
  <button class="speed" id="speed">🐢 Lenta</button>
</header>
<main id="view"></main>
<nav>
  <button data-tab="study" class="on"><span class="ic">📚</span>Studia</button>

let voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/en-GB/i.test(v.lang)&&/female|Kate|Serena|Daniel|Google UK/i.test(v.name))
       || vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let speakingBtn=null;
function speak(text,btn){
  if(!("speechSynthesis" in window)){toast("Audio non disponibile su questo dispositivo");return}
  try{
    speechSynthesis.cancel();
    if(speakingBtn)speakingBtn.classList.remove("speaking");
    const u=new SpeechSynthesisUtterance(text.replace(/…/g,", "));
    u.lang="en-GB"; if(voice)u.voice=voice;
    u.rate=slow?0.78:0.98;
    if(btn){btn.classList.add("speaking");speakingBtn=btn;u.onend=u.onerror=()=>btn.classList.remove("speaking")}
    speechSynthesis.speak(u);
  }catch(e){toast("Audio non disponibile")}
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}

function poolFor(sel){
  let p=[];
  TOPICS.forEach((t,ti)=>t.qs.forEach((_,i)=>{
    if(sel==="all"||String(sel)===String(ti)||(sel==="weak"&&(scores[qid(t.id,i)]||0)<3&&scores[qid(t.id,i)]))p.push([ti,i]);
  }));
  return p;
}
function weightedPick(pool,n){
  const items=pool.map(x=>{const s=scores[qid(TOPICS[x[0]].id,x[1])]||0; return {x,w:s===3?1:s===2?3:s===1?5:4}});
  const out=[];
  while(out.length<n&&items.length){
    const tot=items.reduce((a,b)=>a+b.w,0); let r=Math.random()*tot, k=0;
    for(;k<items.length;k++){r-=items[k].w;if(r<=0)break}
    out.push(items.splice(Math.min(k,items.length-1),1)[0].x);
  }
  return out;
}

  const ok=quiz.res.filter(r=>r.v===3).length, mid=quiz.res.filter(r=>r.v===2).length;
  const msg= ok>=4?["🏆","Sei pronto/a! Ottimo lavoro."]: ok+mid>=3?["💪","Ci sei quasi. Ripassa quelle in rosso."]:["🌱","Ogni ripasso conta. Riprova tra un po'!"];
  let h=`<div class="card center" style="margin-top:16px"><div class="big-emoji">${msg[0]}</div><h2 style="margin-top:6px">${ok} su ${quiz.res.length} sicure</h2><p class="muted">${msg[1]}</p></div>
  <div class="card" style="padding:4px 12px">${quiz.res.map(r=>{const q=TOPICS[r.ti].qs[r.i];return `<button class="qrow" data-q="${r.ti},${r.i}"><span class="dot s${r.v}"></span><span style="flex:1"><b style="font-weight:500">${esc(q.q)}</b><br><span class="muted small">Parole chiave dette: ${r.kw}/${r.tot} · tocca per ripassare</span></span></button>`}).join("")}</div>
  <button class="btn" id="startQuiz">🔁 Altre 5 domande</button>
  <button class="btn alt" data-tabgo="study">📚 Torna a studiare</button>`;
  quiz=null; $view.innerHTML=h;
}

/* ================= VISTA: FRASI ================= */
function viewPhrases(){
  setHeader("Frasi utili",false);
  let h=`<div class="hero"><h2>Le frasi "salvavita"</h2><p class="muted">Funzionano con <b>qualsiasi</b> domanda. Imparane 4–5 e non resterai mai in silenzio.</p></div>`;
  PHRASES.forEach(g=>{
    h+=`<div class="card"><p class="label">${esc(g.t)}</p>${g.items.map(p=>`<div class="ph">${playBtn(p[0],"sm ghost")}<div class="grow"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div></div>`).join("")}</div>`;
  });
  h+=`<div class="card"><p class="label">Consigli per la pronuncia</p>
   <div class="ph"><div class="grow"><b>"th" (the, three)</b><span>Lingua tra i denti, soffia piano. Non dire "de" o "tri".</span></div></div>
   <div class="ph"><div class="grow"><b>Finali "-ed" (developed, measured)</b><span>Spesso non si sente la "e": "di-VÈ-lopt", "MÈ-giurd".</span></div></div>
   <div class="ph"><div class="grow"><b>"-tion" (resolution, function)</b><span>Si legge "scion": "re-zo-LÙ-scion".</span></div></div>
   <div class="ph"><div class="grow"><b>Lettere delle sigle</b><span>C = "sì", P = "pì", U = "iù", I = "ài", G = "gì". CPU = "sì-pì-iù", GUI = "gì-iù-ài".</span></div></div>
   <p class="small muted" style="margin:8px 0 0">Usa il tasto 🐢 in alto per ascoltare più lentamente.</p></div>`;
  $view.innerHTML=h;
}

/* ================= NAVIGAZIONE ================= */
function render(){
  const top=stack[stack.length-1];
  if(top){
    if(top.v==="topic")viewTopic(top.ti);
    else if(top.v==="q")viewQuestion(top.ti,top.i);
    else if(top.v==="quiz")viewQuizQ();
  } else {
    if(tab==="study")viewStudy(); else if(tab==="quiz")viewQuizHome(); else viewPhrases();
  }
}
function go(v){stack.push(v);render();window.scrollTo(0,0)}
function goTab(t){
  tab=t;stack=[];quiz=null;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  render();window.scrollTo(0,0);
}
document.getElementById("back").onclick=()=>{
  if("speechSynthesis" in window)speechSynthesis.cancel();
  const top=stack.pop();
  if(top&&top.v==="quiz")quiz=null;
  render();window.scrollTo(0,0);
};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
document.getElementById("speed").onclick=()=>{slow=!slow;store.set("eoc_slow",slow);updSpeed();toast(slow?"Voce lenta 🐢":"Voce normale 🐇")};
updSpeed();
window.addEventListener("scroll",()=>document.getElementById("hdr").classList.toggle("scrolled",scrollY>4));

$view.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled)return;
  const d=b.dataset;
  if(d.say!==undefined){speak(d.say,b.classList.contains("play")?b:null);return}
  if(d.topic!==undefined){go({v:"topic",ti:+d.topic});return}
  if(d.q){const [ti,i]=d.q.split(",").map(Number);
    const top=stack[stack.length-1];
    if(top&&top.v==="q"){top.ti=ti;top.i=i;render();window.scrollTo(0,0)}
    else go({v:"q",ti,i});
    return}
  if(d.quiztopic!==undefined){quizSel=+d.quiztopic;store.set("eoc_quizsel",quizSel);startQuizFromAnywhere();return}
  if(d.sel!==undefined){quizSel=d.sel==="all"||d.sel==="weak"?d.sel:+d.sel;store.set("eoc_quizsel",quizSel);viewQuizHome();return}
  if(b.id==="startQuiz"){startQuizFromAnywhere();return}
  if(d.stage){quiz.stage=+d.stage;viewQuizQ();return}
  if(d.got!==undefined){const j=+d.got;quiz.got.has(j)?quiz.got.delete(j):quiz.got.add(j);viewQuizQ();return}
  if(d.rate){rate(+d.rate);return}
  if(d.tabgo){goTab(d.tabgo);return}
});
function startQuizFromAnywhere(){
  tab="quiz";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab==="quiz"));
  stack=[];startQuiz(); if(quiz){stack=[{v:"quiz"}];render();window.scrollTo(0,0)} else viewQuizHome();
}
render();
</script>
</body>
</html>
